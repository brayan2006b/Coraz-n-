<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Corazón Compacto HD Dinámico</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #000; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    #container {
      width: 300px; height: 400px; position: relative;
    }
    #background {
      position: absolute; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #000010 0%, #000018 40%, #00001f 100%);
      animation: skywave 10s ease-in-out infinite alternate;
      z-index: -1;
    }
    @keyframes skywave {
      0% { background-size: 100% 100%; }
      100% { background-size: 110% 110%; }
    }
    canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="background"></div>
    <canvas id="canvas"></canvas>
  </div>
  <script>
    const container = document.getElementById('container');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let w, h, dpr;
    const mouse = { x: 0, y: 0, radius: 80 };

    function resize() {
      dpr = window.devicePixelRatio || 1;
      w = container.clientWidth;
      h = container.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // Corazón shape
    function heartShape(t, scale=10) {
      const x = scale*16*Math.pow(Math.sin(t),3);
      const y = -scale*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      return [x,y];
    }
    function randomColor() {
      const cols = ['#ff4d4d','#ff6699','#ff0066','#ff85b3','#ff5e78','#ff3366'];
      return cols[Math.floor(Math.random()*cols.length)];
    }

    // Microbots
    const bots = [];
    const numBots = 4000;
    for(let i=0;i<numBots;i++){
      const t = Math.random()*Math.PI*2;
      const [hx, hy] = heartShape(t);
      const d = Math.pow(Math.random(),0.7);
      const x0 = w/2 + hx*d;
      const y0 = h/2 + hy*d;
      bots.push({ x: x0, y: y0, baseX: x0, baseY: y0, vx: 0, vy: 0, color: randomColor() });
    }

    // Starfield
    const stars = [];
    for(let i=0;i<100;i++){
      stars.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.2, speed: 0.2+Math.random()*0.3 });
    }
    function drawStars(){
      ctx.save(); ctx.globalAlpha=0.3;
      stars.forEach(s=>{
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle='#fff'; ctx.fill();
        s.y += s.speed;
        if(s.y>h){ s.y=0; s.x=Math.random()*w; }
      });
      ctx.restore();
    }

    // Meteoritos
    let meteoros = [];
    function createMeteor() {
      const edge = Math.floor(Math.random()*4);
      let x=0,y=0;
      if(edge===0){ x=-20; y=Math.random()*h; }
      if(edge===1){ x=Math.random()*w; y=-20; }
      if(edge===2){ x=w+20; y=Math.random()*h; }
      if(edge===3){ x=Math.random()*w; y=h+20; }
      const dx = w/2 - x, dy = h/2 - y;
      const dist = Math.hypot(dx,dy);
      const speed = 6;
      meteoros.push({x, y, vx: dx/dist*speed, vy: dy/dist*speed, trail: []});
    }
    setInterval(createMeteor, 2000);

    function drawMeteoros(){
      meteoros.forEach(m=>{
        m.trail.unshift({x:m.x,y:m.y});
        if(m.trail.length>20) m.trail.pop();
        m.trail.forEach((p,i)=>{
          ctx.beginPath(); ctx.arc(p.x,p.y,1.5,0,Math.PI*2);
          ctx.fillStyle=`rgba(255,255,255,${1-i/m.trail.length})`; ctx.fill();
        });
        ctx.beginPath(); ctx.arc(m.x,m.y,4,0,Math.PI*2);
        ctx.fillStyle='white'; ctx.shadowColor='white'; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
        m.x += m.vx; m.y += m.vy;
      });
      meteoros = meteoros.filter(m=>m.x>-30 && m.x<w+30 && m.y>-30 && m.y<h+30);
    }

    // Mouse/touch
    container.addEventListener('mousemove', e=>{
      const rect = container.getBoundingClientRect();
      mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
    });
    container.addEventListener('touchmove', e=>{
      if(e.touches[0]){
        const rect = container.getBoundingClientRect();
        mouse.x = e.touches[0].clientX - rect.left;
        mouse.y = e.touches[0].clientY - rect.top;
      }
    },{passive:true});

    // Animación
    function animate(){
      ctx.clearRect(0,0,w,h);
      drawStars();
      drawMeteoros();
      bots.forEach(bot=>{
        bot.vx += (bot.baseX-bot.x)*0.02;
        bot.vy += (bot.baseY-bot.y)*0.02;
        const dx = bot.x-mouse.x, dy = bot.y-mouse.y;
        const dist = Math.hypot(dx,dy);
        if(dist<mouse.radius){
          const f=(mouse.radius-dist)/mouse.radius;
          const ang=Math.atan2(dy,dx);
          bot.vx += Math.cos(ang)*f*2;
          bot.vy += Math.sin(ang)*f*2;
        }
        meteoros.forEach(m=>{
          const dx2=bot.x-m.x, dy2=bot.y-m.y;
          const d2=Math.hypot(dx2,dy2);
          if(d2<80){
            const f2=(80-d2)/80;
            const ang2=Math.atan2(dy2,dx2);
            bot.vx += Math.cos(ang2)*f2*3;
            bot.vy += Math.sin(ang2)*f2*3;
          }
        });
        bot.vx*=0.9; bot.vy*=0.9;
        bot.x+=bot.vx; bot.y+=bot.vy;
        ctx.beginPath(); ctx.arc(bot.x,bot.y,0.6,0,Math.PI*2);
        ctx.fillStyle=bot.color; ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
